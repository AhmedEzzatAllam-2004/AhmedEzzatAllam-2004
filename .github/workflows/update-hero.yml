name: Update profile hero image

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch: {} # allows manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "scripts/generate-hero.js"
      - "package.json"

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate hero image
        run: node scripts/generate-hero.js
        env:
          GITHUB_USERNAME: ahmedezzatallam-2004

      - name: Commit updated hero if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/gitskins-hero.png; then
            git add assets/gitskins-hero.png
            git commit -m "chore: update profile hero image [skip ci]"
            git push
          else
            echo "No changes to hero image."
          fi
